<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#0a1d32"><title>ZIGRUSH</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#091827;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;touch-action:none}button{font:inherit}.app{height:100%;position:relative;overflow:hidden;background:linear-gradient(#12385b,#081827)}.screen{position:absolute;inset:0;display:none;padding:max(18px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom));overflow:auto}.screen.active{display:flex;flex-direction:column}.top{display:flex;align-items:center;justify-content:space-between}.brand{font-size:36px;font-weight:950;letter-spacing:.12em}.muted{color:#a8bdd0}.hero{margin:auto 0;text-align:center}.skiIcon{font-size:88px;filter:drop-shadow(0 10px 18px #0008);margin-bottom:18px}.btn{border:0;border-radius:18px;padding:16px 22px;min-height:56px;color:#fff;font-weight:850;background:linear-gradient(135deg,#1db4ff,#3159ff);box-shadow:0 10px 28px #008cff55}.pill{background:#081827cc;border:1px solid #31506b;border-radius:15px;padding:9px 13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.card{border:1px solid #294b68;background:#0d2942;color:#fff;border-radius:18px;padding:15px;text-align:left}.card b{display:block;margin-top:5px}.footer{text-align:center;color:#6f8aa1;font-size:12px;margin-top:14px}#game{padding:0;background:#dcecf3;overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:none}.hud{position:absolute;left:12px;right:12px;top:max(12px,env(safe-area-inset-top));display:flex;justify-content:space-between;pointer-events:none}.tip{position:absolute;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translateX(-50%);background:#071728bb;padding:9px 14px;border-radius:20px;font-size:13px;pointer-events:none;transition:opacity .3s}.over{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#06111dcc;padding:22px}.over.show{display:flex}.modal{width:min(360px,100%);background:#0c243a;border:1px solid #315675;border-radius:24px;padding:24px;text-align:center}.big{font-size:52px;font-weight:950}.row{display:flex;gap:10px}.row .btn{flex:1}.secondary{background:#18364e;box-shadow:none}.badge{display:inline-block;background:#143550;border-radius:20px;padding:7px 12px;margin-top:10px;font-size:13px}.stat{font-size:13px;color:#b6c7d6}.settings{display:flex;justify-content:space-between;align-items:center;padding:14px;background:#0d2942;border-radius:16px;margin-top:10px}.toggle{border:0;border-radius:12px;background:#237dc0;color:#fff;padding:9px 13px}.back{border:0;width:46px;height:46px;border-radius:50%;background:#143550;color:#fff;font-size:24px}
</style></head><body><div class="app">
<section id="menu" class="screen active"><div class="top"><div><div class="brand">ZIGRUSH</div><div class="muted">Спуск. Ритм. Рекорд.</div></div><div class="pill">★ <span id="bank">0</span></div></div><div class="hero"><div class="skiIcon">⛷️</div><button id="play" class="btn" style="width:min(360px,90%)">Играть</button><div class="badge">Рекорд: <b id="best">0</b> м</div></div><div class="grid"><button class="card" id="practice">🎿<b>Тренировка</b><span class="muted">Без препятствий</span></button><button class="card" id="settingsBtn">⚙️<b>Настройки</b><span class="muted">Звук и вибрация</span></button></div><div class="footer">ZIGRUSH 2.1 • Alpine Polish</div></section>
<section id="settings" class="screen"><div class="top"><button class="back" id="back">‹</button><h2>Настройки</h2><span></span></div><div class="settings"><span>Звук</span><button id="sound" class="toggle"></button></div><div class="settings"><span>Вибрация</span><button id="vib" class="toggle"></button></div><p class="muted">Рекорд и звёзды сохраняются автоматически.</p></section>
<section id="game" class="screen"><canvas id="cv"></canvas><div class="hud"><div class="pill"><b id="meters">0</b> м</div><div class="pill">★ <b id="stars">0</b></div></div><div id="tip" class="tip">Касайся экрана, чтобы менять направление</div><div id="over" class="over"><div class="modal"><div class="stat">Дистанция</div><div class="big"><span id="final">0</span> м</div><div class="stat">Рекорд: <span id="best2">0</span> м • ★ <span id="earned">0</span></div><div class="row" style="margin-top:20px"><button id="home" class="btn secondary">Домой</button><button id="again" class="btn">Ещё раз</button></div></div></div></section>
</div><script>
(()=>{'use strict';const $=s=>document.querySelector(s),screens=[...document.querySelectorAll('.screen')];const KEY='zigrush_v21';let save={best:0,bank:0,sound:true,vib:true};try{save={...save,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(_){}const persist=()=>localStorage.setItem(KEY,JSON.stringify(save));function show(id){screens.forEach(s=>s.classList.toggle('active',s.id===id));}function ui(){$('#best').textContent=save.best;$('#best2').textContent=save.best;$('#bank').textContent=save.bank;$('#sound').textContent=save.sound?'Вкл.':'Выкл.';$('#vib').textContent=save.vib?'Вкл.':'Выкл.'}ui();
let audio;function clickSound(freq=240,dur=.045){if(!save.sound)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(.025,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}catch(_){}}function buzz(ms=10){if(save.vib&&navigator.vibrate)navigator.vibrate(ms)}
const cv=$('#cv'),ctx=cv.getContext('2d',{alpha:false});let W=360,H=700,D=1,playing=false,practice=false,raf=0,last=0,dir=1,x=0,y=0,meters=0,runStars=0,speed=150,objects=[],decor=[],particles=[],nextSpawn=0,nextDecor=0,elapsed=0,tipTime=0;
function resize(){const r=cv.getBoundingClientRect();W=Math.max(1,r.width);H=Math.max(1,r.height);D=Math.min(window.devicePixelRatio||1,2);cv.width=Math.round(W*D);cv.height=Math.round(H*D);ctx.setTransform(D,0,0,D,0,0);y=H*.72;if(!playing)x=W/2}window.addEventListener('resize',resize,{passive:true});
function trackCenter(screenY){const phase=(meters*2.2+screenY)*.004;return W/2+Math.sin(phase)*Math.min(42,W*.105)+Math.sin(phase*.43)*Math.min(16,W*.04)}function trackWidth(){return Math.max(205,Math.min(300,W*.73))}
function spawn(){const top=-70,c=trackCenter(top),tw=trackWidth(),margin=34,safeHalf=58;const left=c-tw/2+margin,right=c+tw/2-margin,roll=Math.random();if(!practice&&meters>35&&roll<.62){const side=Math.random()<.5?-1:1;const min=safeHalf+34,max=Math.max(min+2,tw/2-margin);let ox=c+side*(min+Math.random()*Math.max(1,max-min));ox=Math.max(left,Math.min(right,ox));const kinds=meters>90?['tree','tree','rock','stump']:['tree','tree','tree','rock'];objects.push({kind:kinds[(Math.random()*kinds.length)|0],x:ox,y:top,r:16})}if(Math.random()<.82){let sx=c+(Math.random()-.5)*tw*.34;sx=Math.max(left+6,Math.min(right-6,sx));objects.push({kind:'star',x:sx,y:top-18,r:9})}}
function spawnDecor(){const top=-70,c=trackCenter(top),tw=trackWidth(),side=Math.random()<.5?-1:1;decor.push({x:c+side*(tw/2+32+Math.random()*70),y:top,s:0.75+Math.random()*.65})}
function start(isPractice=false){practice=isPractice;show('game');resize();playing=true;cancelAnimationFrame(raf);dir=Math.random()<.5?-1:1;x=W/2;y=H*.72;meters=0;runStars=0;speed=142;objects=[];decor=[];particles=[];nextSpawn=0;nextDecor=0;elapsed=0;tipTime=3;$('#over').classList.remove('show');$('#tip').style.opacity='1';$('#meters').textContent='0';$('#stars').textContent='0';last=performance.now();raf=requestAnimationFrame(frame)}
function end(){if(!playing)return;playing=false;cancelAnimationFrame(raf);const m=Math.floor(meters);if(!practice){save.bank+=runStars;if(m>save.best)save.best=m;persist()}ui();$('#final').textContent=m;$('#earned').textContent=runStars;$('#over').classList.add('show');buzz(35);clickSound(120,.09)}
function turn(e){if(!playing)return;if(e)e.preventDefault();dir=-dir;clickSound(260,.035);buzz(7)}cv.addEventListener('pointerdown',turn,{passive:false});
function frame(now){if(!playing)return;let dt=(now-last)/1000;last=now;if(!Number.isFinite(dt)||dt<=0)dt=.016;dt=Math.min(dt,.033);elapsed+=dt;tipTime-=dt;if(tipTime<=0)$('#tip').style.opacity='0';speed=Math.min(255,142+meters*.055);meters+=speed*dt*.047;const lateral=Math.min(128,92+meters*.022);x+=dir*lateral*dt;const tw=trackWidth(),c=trackCenter(y),edge=tw/2-18;if(x<c-edge||x>c+edge){end();draw();return}nextSpawn-=speed*dt;if(nextSpawn<=0){spawn();nextSpawn+=100+Math.random()*38}nextDecor-=speed*dt;if(nextDecor<=0){spawnDecor();nextDecor+=58+Math.random()*65}for(let i=decor.length-1;i>=0;i--){decor[i].y+=speed*dt;if(decor[i].y>H+80)decor.splice(i,1)}for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.a-=dt*1.7;if(p.a<=0)particles.splice(i,1)}if(Math.random()<.28){particles.push({x:x-dir*8+(Math.random()-.5)*8,y:y+19,vx:-dir*(10+Math.random()*12),vy:20+Math.random()*22,a:.65})}for(let i=objects.length-1;i>=0;i--){const o=objects[i];o.y+=speed*dt;if(o.kind==='star'){if(Math.abs(o.y-y)<22&&Math.abs(o.x-x)<20){objects.splice(i,1);runStars++;$('#stars').textContent=runStars;clickSound(620,.04);continue}}else if(!practice&&Math.abs(o.y-y)<27&&Math.hypot(o.x-x,o.y-y)<24){end();draw();return}if(o.y>H+60)objects.splice(i,1)}$('#meters').textContent=Math.floor(meters);draw();raf=requestAnimationFrame(frame)}
function drawSkier(){ctx.save();ctx.translate(x,y);ctx.rotate(dir*.18);ctx.strokeStyle='#243746';ctx.lineWidth=3;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-15,18);ctx.lineTo(14,-16);ctx.moveTo(-5,22);ctx.lineTo(23,-12);ctx.stroke();ctx.strokeStyle='#5a6974';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-7,0);ctx.lineTo(-19,14);ctx.moveTo(7,0);ctx.lineTo(18,15);ctx.stroke();ctx.fillStyle='#e33d3d';ctx.beginPath();ctx.roundRect(-9,-7,18,24,6);ctx.fill();ctx.fillStyle='#f3c49b';ctx.beginPath();ctx.arc(0,-15,8,0,Math.PI*2);ctx.fill();ctx.fillStyle='#1c3347';ctx.beginPath();ctx.arc(0,-18,8,Math.PI,Math.PI*2);ctx.fill();ctx.fillStyle='#163b61';ctx.fillRect(-8,-12,16,4);ctx.restore()}
function draw(){ctx.fillStyle='#d8edf6';ctx.fillRect(0,0,W,H);const tw=trackWidth();ctx.fillStyle='#f8fcff';ctx.beginPath();for(let yy=-20;yy<=H+20;yy+=10){const xx=trackCenter(yy)-tw/2;yy===-20?ctx.moveTo(xx,yy):ctx.lineTo(xx,yy)}for(let yy=H+20;yy>=-20;yy-=10)ctx.lineTo(trackCenter(yy)+tw/2,yy);ctx.closePath();ctx.fill();ctx.strokeStyle='#8eafbf';ctx.lineWidth=5;for(const side of[-1,1]){ctx.beginPath();for(let yy=-20;yy<=H+20;yy+=10){const xx=trackCenter(yy)+side*tw/2;yy===-20?ctx.moveTo(xx,yy):ctx.lineTo(xx,yy)}ctx.stroke()}function pine(px,py,sc=1){ctx.save();ctx.translate(px,py);ctx.scale(sc,sc);ctx.fillStyle='#6b4930';ctx.fillRect(-3,5,6,12);ctx.fillStyle='#1f664a';for(const q of[[0,-25,16],[0,-13,20],[0,0,23]]){ctx.beginPath();ctx.moveTo(q[0],q[1]-12);ctx.lineTo(-q[2],q[1]+14);ctx.lineTo(q[2],q[1]+14);ctx.closePath();ctx.fill()}ctx.restore()}function starShape(px,py,r){ctx.save();ctx.translate(px,py);ctx.fillStyle='#ffc62f';ctx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2? r*.45:r;const xx=Math.cos(a)*rr,yy=Math.sin(a)*rr;i?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy)}ctx.closePath();ctx.fill();ctx.fillStyle='#fff4b0';ctx.beginPath();ctx.arc(-2,-3,2,0,Math.PI*2);ctx.fill();ctx.restore()}for(const d of decor)pine(d.x,d.y,d.s);for(const p of particles){ctx.globalAlpha=Math.max(0,p.a);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(p.x,p.y,2.2,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;for(const o of objects){if(o.kind==='star')starShape(o.x,o.y,10);else if(o.kind==='tree')pine(o.x,o.y,1);else if(o.kind==='rock'){ctx.fillStyle='#71818b';ctx.beginPath();ctx.ellipse(o.x,o.y+4,17,13,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#9aa8af';ctx.beginPath();ctx.ellipse(o.x-5,o.y,6,4,-.4,0,Math.PI*2);ctx.fill()}else{ctx.fillStyle='#7a4f2e';ctx.fillRect(o.x-9,o.y-8,18,18);ctx.fillStyle='#b77a49';ctx.beginPath();ctx.ellipse(o.x,o.y-8,9,4,0,0,Math.PI*2);ctx.fill()}}drawSkier()}
$('#play').onclick=()=>start(false);$('#practice').onclick=()=>start(true);$('#again').onclick=()=>start(practice);$('#home').onclick=()=>{playing=false;cancelAnimationFrame(raf);show('menu');ui()};$('#settingsBtn').onclick=()=>show('settings');$('#back').onclick=()=>show('menu');$('#sound').onclick=()=>{save.sound=!save.sound;persist();ui()};$('#vib').onclick=()=>{save.vib=!save.vib;persist();ui()};
try{const A=window.Capacitor?.Plugins?.App;if(A)A.addListener('backButton',()=>{if($('#game').classList.contains('active')){$('#home').click()}else if($('#settings').classList.contains('active'))show('menu');else A.exitApp()})}catch(_){}
resize();draw();})();
</script></body></html>
